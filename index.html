<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Sức Bền Tài Chính — MVP V1.2</title>
<style>
  :root{
    --bg:#f6f8f7;
    --card:#ffffff;
    --ink:#16312b;
    --muted:#6b7d78;
    --line:#dde7e3;
    --accent:#178f67;
    --accent-2:#e8f6f0;
    --soft:#f0f5f3;
    --warn:#a96d20;
    --shadow:0 12px 30px rgba(26,60,49,.08);
    --radius:24px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(180deg,#f9fbfa 0%,var(--bg) 100%);color:var(--ink);min-height:100vh}
  .app{max-width:760px;margin:0 auto;min-height:100vh;padding:18px 16px 40px}
  .topbar{display:flex;align-items:center;gap:12px;margin:2px 0 18px}
  .brandmark{width:42px;height:42px;border-radius:14px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:21px;font-weight:800;box-shadow:var(--shadow)}
  .brandtxt{line-height:1.2}.brandtxt b{display:block;font-size:15px}.brandtxt span{font-size:12px;color:var(--muted)}
  .progressWrap{margin-left:auto;min-width:125px}.progressLabel{font-size:11px;color:var(--muted);text-align:right;margin-bottom:6px}.progress{height:7px;background:#e7efec;border-radius:999px;overflow:hidden}.progress>div{height:100%;width:0;background:var(--accent);transition:width .35s ease}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 22px}
  .hero{padding-top:34px;padding-bottom:34px}.heroIcon{font-size:52px;margin-bottom:14px}
  h1,h2,h3{margin:0 0 12px;letter-spacing:-.02em}h1{font-size:31px;line-height:1.12}h2{font-size:25px;line-height:1.2}h3{font-size:19px}
  p{font-size:16px;line-height:1.6;margin:8px 0;color:#29443c}.muted{color:var(--muted)}
  .note{background:var(--soft);border-radius:18px;padding:14px 16px;margin-top:16px;font-size:14px;line-height:1.5;color:#49625a}
  .btn{width:100%;border:none;border-radius:17px;padding:16px 18px;font-size:16px;font-weight:750;cursor:pointer;transition:.18s ease;margin-top:16px}
  .btn.primary{background:var(--accent);color:white;box-shadow:0 9px 18px rgba(23,143,103,.18)}
  .btn.primary:hover{transform:translateY(-1px)}
  .btn.secondary{background:var(--accent-2);color:#0c6d4d}
  .btn.ghost{background:white;border:1px solid var(--line);color:var(--ink)}
  .grid{display:grid;gap:10px;margin-top:18px}.option{border:1px solid var(--line);background:#fff;border-radius:17px;padding:15px 16px;text-align:left;font-size:15px;line-height:1.45;cursor:pointer;transition:.16s ease;color:var(--ink)}
  .option:hover{border-color:#9ecfbd;background:#fbfefd;transform:translateY(-1px)}
  .option.selected{border-color:var(--accent);background:var(--accent-2)}
  .kicker{font-size:13px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
  .fun{font-size:14px;color:var(--muted);font-style:italic;margin-top:12px}
  .reaction{margin-top:16px;background:var(--accent-2);padding:13px 15px;border-radius:16px;font-size:14px;color:#0e6348;display:none}
  .field{margin-top:16px}.field label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}.field input{width:100%;padding:15px;border:1px solid var(--line);border-radius:15px;font-size:16px;outline:none}.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(23,143,103,.08)}
  .seg{display:flex;gap:8px}.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px;font-weight:700;cursor:pointer}.seg button.active{background:var(--accent-2);border-color:var(--accent);color:#0c6d4d}
  .transition{padding:36px 22px;text-align:center}.transition .emoji{font-size:48px;margin-bottom:12px}
  .resultHead{display:flex;gap:14px;align-items:center;margin-bottom:18px}.badge{width:58px;height:58px;border-radius:18px;background:var(--accent-2);display:grid;place-items:center;font-size:30px}.persona{font-size:13px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
  .metrics{display:grid;gap:13px;margin:18px 0}.metric{border:1px solid var(--line);border-radius:17px;padding:14px 15px}.metricTop{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:750}.metricTop span:last-child{color:var(--accent)}.bar{height:8px;background:#e7efec;border-radius:999px;overflow:hidden;margin-top:9px}.bar>div{height:100%;background:var(--accent);border-radius:999px}.metric small{display:block;margin-top:7px;color:var(--muted);font-size:12px}
  .insight{background:#f9fbfa;border-left:4px solid var(--accent);border-radius:0 17px 17px 0;padding:16px 17px;margin-top:18px}.insight b{color:#0a694b}
  .ytbox{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ytitem{background:var(--soft);border-radius:16px;padding:14px}.ytitem strong{display:block;font-size:20px;margin-top:6px}.gap{margin-top:10px;font-size:14px;color:#4c615b}
  .feedback{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}.feedbackBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.feedbackBtns button{padding:11px;border-radius:13px;border:1px solid var(--line);background:white;cursor:pointer;font-weight:700}.feedbackBtns button.active{background:var(--accent-2);border-color:var(--accent)}
  .tiny{font-size:12px;color:var(--muted)}
  .footer{padding:18px 4px 0;text-align:center;color:var(--muted);font-size:11px}
  .hidden{display:none!important}
  @media(max-width:520px){.app{padding:12px 10px 30px}.card{padding:22px 17px;border-radius:21px}h1{font-size:28px}h2{font-size:23px}.progressWrap{min-width:105px}.feedbackBtns{grid-template-columns:1fr}.ytbox{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brandmark">S</div>
    <div class="brandtxt"><b>Sức Bền Tài Chính</b><span>MVP V1.2 • Tầng 1</span></div>
    <div class="progressWrap" id="progressWrap" style="display:none">
      <div class="progressLabel" id="progressLabel">Khám phá bản thân</div>
      <div class="progress"><div id="progressBar"></div></div>
    </div>
  </div>
  <main id="screen"></main>
  <div class="footer">Bản prototype thử nghiệm — không có đáp án đúng hay sai.</div>
</div>
<script>
const state = {
  name:'', pronoun:'Anh', current:0,
  answers:{}, scores:{}, flags:{},
  history:[]
};

const screen = document.getElementById('screen');
const progressWrap = document.getElementById('progressWrap');
const progressBar = document.getElementById('progressBar');
const progressLabel = document.getElementById('progressLabel');

function who(){ return `${state.pronoun} ${state.name}`.trim(); }
function capPronoun(){ return state.pronoun || 'Bạn'; }
function lowerPronoun(){ return state.pronoun==='Bạn' ? 'bạn' : state.pronoun.toLowerCase(); }
function setProgress(step){
  progressWrap.style.display = step? 'block':'none';
  if(!step) return;
  const pct = Math.min(100, Math.round((step/12)*100));
  progressBar.style.width = pct+'%';
  const labels = step<=3?'Khám phá bản thân':step<=6?'Hiểu nguồn lực':step<=9?'Kiểm tra vùng đệm':'Ghép bức tranh';
  progressLabel.textContent = labels;
}
function render(html, step=0){ screen.innerHTML=html; setProgress(step); window.scrollTo({top:0,behavior:'smooth'}); }
function primary(label, action){ return `<button class="btn primary" onclick="${action}">${label}</button>`; }
function optionList(options, qid, reactionFn){
  return `<div class="grid">${options.map((o,i)=>`<button class="option" onclick="answer('${qid}', ${i}, this)"><b>${String.fromCharCode(65+i)}.</b> ${o.label}</button>`).join('')}</div><div id="reaction" class="reaction"></div>`;
}

function intro(){
  render(`<section class="card hero">
    <div class="heroIcon">🌱</div>
    <div class="kicker">Một cuộc khám phá nhỏ về chính mình</div>
    <h1>Thật tuyệt khi bạn dành vài phút để hiểu rõ hơn về tài chính của chính mình 👏</h1>
    <p>Không cần biết nhiều về tài chính. Chỉ cần trả lời đúng với cuộc sống hiện tại của bạn.</p>
    <div class="note">Sau vài phút, bạn sẽ nhìn thấy một bức tranh khá thú vị về <b>điều mình đang xây dựng – những gì mình muốn giữ – và mức độ chủ động hiện tại.</b><br><br>Khoảng 4–5 phút • Không có đáp án đúng hay sai.</div>
    ${primary('Khám phá bức tranh của tôi →','profile()')}
  </section>`);
}
function profile(){
  render(`<section class="card">
    <div class="kicker">Làm quen một chút</div>
    <h2>Trước khi bắt đầu, mình làm quen nhé 😊</h2>
    <div class="field"><label>Bạn tên là gì?</label><input id="nameInput" placeholder="Ví dụ: Minh" maxlength="30"></div>
    <div class="field"><label>Mình nên xưng hô với bạn thế nào?</label><div class="seg" id="pronouns">
      <button class="active" onclick="choosePronoun('Anh',this)">Anh</button>
      <button onclick="choosePronoun('Chị',this)">Chị</button>
      <button onclick="choosePronoun('Bạn',this)">Bạn</button>
    </div></div>
    <button class="btn primary" onclick="saveProfile()">Tiếp tục →</button>
  </section>`);
}
function choosePronoun(p, el){ state.pronoun=p; document.querySelectorAll('#pronouns button').forEach(b=>b.classList.remove('active')); el.classList.add('active'); }
function saveProfile(){ const v=document.getElementById('nameInput').value.trim(); state.name=v||'Minh'; welcome(); }
function welcome(){
  render(`<section class="card transition"><div class="emoji">👋</div><h2>Rất vui được đồng hành cùng ${who()}!</h2><p>Mỗi người có một cách xây dựng cuộc sống khác nhau, vì vậy ở đây không có câu trả lời “chuẩn”.</p><div class="note">Điều thú vị là sau vài lựa chọn, ${lowerPronoun()} sẽ nhìn thấy <b>những phần đang khá vững và những phần có thể cần được củng cố thêm.</b></div>${primary('Xem thử nào →','q1()')}</section>`);
}

const Q1=[
 {label:'Con cái có một nền tảng tốt hơn',key:'child',reaction:'Có vẻ tương lai của con là một phần rất quan trọng trong bức tranh ❤️'},
 {label:'Có thêm nhà, đất hoặc tài sản',key:'asset',reaction:'Có vẻ bạn thuộc “team xây tài sản” rồi 😄'},
 {label:'Công việc/kinh doanh phát triển hơn',key:'business',reaction:'Công việc đang là một động lực khá lớn.'},
 {label:'Khoản tích lũy và đầu tư lớn hơn',key:'invest',reaction:'Bạn khá coi trọng việc để nguồn lực tiếp tục lớn lên.'},
 {label:'Cuộc sống tương lai thảnh thơi hơn',key:'future',reaction:'Có vẻ điều bạn hướng tới nhiều nhất là sự chủ động về sau.'}
];
function q1(){
 render(`<section class="card"><div class="kicker">Câu 1 • Điều đang xây</div><h2>${who()} này, nếu 3–5 năm tới mọi việc diễn ra khá thuận lợi, điều gì khiến ${lowerPronoun()} cảm thấy mình đang đi đúng hướng nhất?</h2>${optionList(Q1,'q1')}<div class="fun">Biết là muốn cả 5 😄 Nhưng thử chọn điều khiến mình vui nhất nhé.</div></section>`,1);
}
function q2(){
 const k=state.answers.q1?.key;
 const prompts={child:'Kế hoạch dành cho con hiện đã được chuẩn bị đến đâu rồi?',asset:'Mục tiêu tài sản bạn đang hướng tới hiện đã được chuẩn bị đến đâu?',business:'Kế hoạch phát triển công việc hiện đã được chuẩn bị đến đâu?',invest:'Kế hoạch tích lũy và đầu tư hiện đã đi đến đâu?',future:'Kế hoạch cho cuộc sống bạn mong muốn sau này đã được chuẩn bị đến đâu?'};
 const opts=['Chủ yếu mới đang nghĩ tới','Đã bắt đầu nhưng chưa tách nguồn rõ','Đã có một phần nguồn lực','Có kế hoạch và nguồn lực khá rõ','Có nguồn riêng và đang đi đúng lộ trình'];
 render(`<section class="card"><div class="kicker">Câu 2 • Mức độ chắc của mục tiêu</div><h2>${prompts[k]}</h2>${optionList(opts.map((x,i)=>({label:x,score:i})),'q2')}</section>`,2);
}
function q3(){
 const opts=[{label:'Công việc/lương chuyên môn',key:'salary'},{label:'Kinh doanh riêng',key:'business'},{label:'Đầu tư và tài sản',key:'asset'},{label:'Nhiều nguồn kết hợp',key:'mixed'}];
 render(`<section class="card"><div class="kicker">Câu 3 • Tài sản tạo thu nhập</div><h2>Hiện tại nguồn lực tài chính của ${who()} chủ yếu được tạo ra từ đâu?</h2>${optionList(opts,'q3')}</section>`,3);
}
function q4(){
 const k=state.answers.q3?.key;
 const prompts={
  salary:`Nếu coi khả năng tạo thu nhập của ${who()} là một tài sản, tài sản này hiện có “nguồn thay thế” nào nếu phải tạm ngừng hoạt động khoảng 6 tháng?`,
  business:`Nếu ${lowerPronoun()} tạm rời hoạt động kinh doanh 3–6 tháng, hệ thống hiện tại có thể tiếp tục tạo dòng tiền ở mức nào?`,
  asset:`Nếu thị trường không thuận lợi trong 6 tháng, những nguồn còn lại có giúp cuộc sống gần như không phải thay đổi không?`,
  mixed:`Nếu nguồn tạo tiền lớn nhất tạm dừng, những nguồn còn lại có thể thay thế được bao nhiêu?`
 };
 const opts=['Gần như không có nguồn thay thế','Chỉ thay thế được một phần nhỏ','Khoảng một nửa','Phần lớn','Gần như không ảnh hưởng'];
 render(`<section class="card"><div class="kicker">Câu 4 • Sức bền của nguồn tạo tiền</div><h2>${prompts[k]}</h2>${optionList(opts.map((x,i)=>({label:x,score:i})),'q4')}<div class="note">Khả năng tạo ra thu nhập cũng là một dạng <b>tài sản tạo tiền</b> — chỉ là nó không nằm trong két hay trên sổ đỏ.</div></section>`,4);
}
function q5(){
 const opts=[{label:'Con cái',key:'child'},{label:'Bố mẹ/người thân',key:'parents'},{label:'Cả hai',key:'both'},{label:'Hiện tại chủ yếu là bản thân tôi',key:'self'}];
 render(`<section class="card"><div class="kicker">Câu 5 • Những người quan trọng</div><h2>Ngoài bản thân mình, hiện có ai mà ${who()} vẫn muốn đảm bảo cuộc sống và những kế hoạch quan trọng cho họ không?</h2>${optionList(opts,'q5')}</section>`,5);
}
function q6(){
 const k=state.answers.q5?.key;
 const prompts={child:`Nếu thu nhập của ${lowerPronoun()} giảm đáng kể một thời gian, kế hoạch dành cho con có thể được giữ gần như nguyên vẹn trong bao lâu?`,parents:'Việc hỗ trợ bố mẹ/người thân có thể được duy trì như hiện tại trong bao lâu?',both:'Nếu thu nhập giảm một thời gian, những trách nhiệm với con và bố mẹ có thể được duy trì cùng lúc trong bao lâu?',self:`Nếu thu nhập giảm đáng kể, mức sống và những mục tiêu riêng của ${lowerPronoun()} có thể được giữ như hiện tại trong bao lâu?`};
 const opts=[{label:'Dưới 3 tháng',score:0},{label:'3–6 tháng',score:1},{label:'6–12 tháng',score:2},{label:'Trên 12 tháng',score:3},{label:'Phần này đã có nguồn tương đối riêng',score:4}];
 render(`<section class="card"><div class="kicker">Câu 6 • Khả năng duy trì</div><h2>${prompts[k]}</h2>${optionList(opts,'q6')}</section>`,6);
}
function transition1(){
 render(`<section class="card transition"><div class="emoji">🧩</div><h2>Cảm ơn ${who()}!</h2><p>Đến đây chúng ta đã biết khá rõ điều ${lowerPronoun()} đang xây dựng.</p><div class="note">Bây giờ thử xem: <b>những kế hoạch đó đang được “chống lưng” tốt đến đâu? 😉</b></div>${primary('Tiếp tục →','q7()')}</section>`,6);
}
function q7(){
 const opts=[{label:'Khoản dành cho con/gia đình',key:'family'},{label:'Đầu tư dài hạn',key:'investment'},{label:'Nhà đất/tài sản lớn',key:'property'},{label:'Nguồn vốn tạo thu nhập',key:'business_capital'},{label:'Khoản dành cho cuộc sống tương lai',key:'future'},{label:'Tôi chưa phân chia thật rõ',key:'unclear'}];
 render(`<section class="card"><div class="kicker">Câu 7 • Điều ít muốn đổi nhiệm vụ nhất</div><h2>Trong những gì đang có, khoản nào ${who()} ít muốn phải đổi nhiệm vụ nhất?</h2>${optionList(opts,'q7')}<div class="fun">Nôm na là: “ống heo” nào mình ít muốn phải đập nhất? 😄</div></section>`,7);
}
function q8(){
 const opts=[{label:'Một nguồn riêng đã chuẩn bị',key:'dedicated',score:4},{label:'Tiền đang để dành',key:'savings',score:3},{label:'Một khoản đầu tư',key:'investment',score:2},{label:'Nguồn vốn cho công việc',key:'business_capital',score:1},{label:'Huy động thêm từ nguồn khác',key:'external',score:0}];
 render(`<section class="card"><div class="kicker">Câu 8 • Tình huống giả định</div><h2>Thử một tình huống giả định nhé. Nếu ngày mai gia đình cần chuẩn bị khoảng <b>500 triệu–1 tỷ</b> cho một vấn đề sức khỏe lớn, nguồn nào sẽ xuất hiện đầu tiên trong đầu ${who()}?</h2>${optionList(opts,'q8')}<div class="note">Không cần nghĩ quá căng. Mục đích chỉ là xem phản xạ tài chính tự nhiên của mình sẽ đi về đâu.</div></section>`,8);
}
function q9(){
 const k=state.answers.q8?.key; let prompt='', opts=[];
 if(k==='savings'){prompt='Khoản tiền đó hiện có đang mang một nhiệm vụ khác không?';opts=['Phần lớn đang dành cho việc khác','Khá nhiều','Khoảng một nửa','Chủ yếu để dự phòng','Hoàn toàn là nguồn riêng'].map((x,i)=>({label:x,score:i}));}
 if(k==='investment'){prompt='Nếu đúng lúc cần mà thị trường không thuận lợi, bạn có nguồn khác để không phải rút khoản đầu tư đó không?';opts=['Không','Khá khó','Có thể xoay một phần','Có nguồn thay thế khá tốt','Có nguồn riêng'].map((x,i)=>({label:x,score:i}));}
 if(k==='business_capital'){prompt='Nếu sử dụng nguồn vốn đó, khả năng tạo thu nhập phía sau sẽ bị ảnh hưởng thế nào?';opts=['Rất nhiều','Khá nhiều','Một phần','Ít','Gần như không'].map((x,i)=>({label:x,score:i}));}
 if(k==='external'){prompt='Nếu nguồn hỗ trợ đó không thuận lợi đúng lúc cần, bạn còn phương án nào khác không?';opts=['Chưa có','Rất hạn chế','Có thể xoay sở','Có nguồn thứ hai khá rõ','Có nguồn độc lập'].map((x,i)=>({label:x,score:i}));}
 if(k==='dedicated'){prompt='Nguồn riêng này nếu phải sử dụng cho một tình huống lớn có thể duy trì sự chủ động khoảng bao lâu?';opts=[{label:'Dưới 3 tháng',score:1},{label:'3–6 tháng',score:2},{label:'6–12 tháng',score:3},{label:'Trên 12 tháng',score:4},{label:'Tôi chưa từng tính',score:2,flag:'unknown_buffer'}];}
 render(`<section class="card"><div class="kicker">Câu 9 • Đào sâu nguồn lực</div><h2>${prompt}</h2>${optionList(opts,'q9')}</section>`,9);
}
function q10(){
 const opts=[{label:'Dưới 3 tháng',score:0},{label:'3–6 tháng',score:1},{label:'6–12 tháng',score:3},{label:'Trên 12 tháng',score:4},{label:'Tôi chưa từng tính cụ thể',score:1,flag:'unknown_resilience'}];
 render(`<section class="card"><div class="kicker">Câu 10 • Sức chịu đựng thật</div><h2>Nếu nguồn thu chính dừng từ ngày mai, gia đình có thể duy trì mức sống hiện tại bao lâu mà chưa phải thay đổi một kế hoạch lớn?</h2>${optionList(opts,'q10')}<div class="fun">“Chắc cũng được lâu” chưa phải một đơn vị thời gian đâu nhé 😄</div></section>`,10);
}
function q11(){
 const opts=[
  {label:'Chọn phương án phù hợp với khả năng lúc đó',score:0},
  {label:'Có thể cân nhắc giữa chi phí và chất lượng',score:1},
  {label:'Chủ động chọn nơi điều trị và bác sĩ mình tin tưởng',score:2},
  {label:'Có thể tiếp cận phương án tốt hơn mà không quá lo về chi phí',score:3},
  {label:'Ưu tiên điều tốt nhất cho sức khỏe trước, còn nguồn lực đã có sự chuẩn bị',score:4}
 ];
 render(`<section class="card"><div class="kicker">Câu 11 • Quyền chủ động y tế</div><h2>Nếu bác sĩ đưa ra một vài phương án điều trị với mức chi phí khác nhau, ${who()} mong mình ở vị thế nào?</h2>${optionList(opts,'q11')}<div class="note">Câu này không đo “giỏi hay kém”. Nó chỉ cho biết <b>mức quyền lựa chọn mà mình mong muốn</b>.</div></section>`,11);
}
function q12(){
 const opts=[{label:'Tương lai của con',key:'child'},{label:'Mức sống của gia đình',key:'lifestyle'},{label:'Tài sản đang gây dựng',key:'asset'},{label:'Nguồn vốn tạo thu nhập',key:'income_capital'},{label:'Cuộc sống của bố mẹ/người thân',key:'parents'},{label:'Sự chủ động và quyền lựa chọn của chính mình',key:'autonomy'}];
 render(`<section class="card"><div class="kicker">Câu 12 • Điều muốn giữ nhất</div><h2>Một câu cuối thôi, ${who()} 😊 Nếu có thể “khóa” một điều để một tình huống bất ngờ không được phép làm thay đổi nó, ${lowerPronoun()} sẽ chọn gì?</h2>${optionList(opts,'q12')}</section>`,12);
}

function answer(qid, idx, el){
  const funcs={q1:Q1};
  let opts;
  if(qid==='q1') opts=Q1;
  else if(qid==='q2') opts=['Chủ yếu mới đang nghĩ tới','Đã bắt đầu nhưng chưa tách nguồn rõ','Đã có một phần nguồn lực','Có kế hoạch và nguồn lực khá rõ','Có nguồn riêng và đang đi đúng lộ trình'].map((x,i)=>({label:x,score:i}));
  else if(qid==='q3') opts=[{label:'Công việc/lương chuyên môn',key:'salary'},{label:'Kinh doanh riêng',key:'business'},{label:'Đầu tư và tài sản',key:'asset'},{label:'Nhiều nguồn kết hợp',key:'mixed'}];
  else if(qid==='q4') opts=['Gần như không có nguồn thay thế','Chỉ thay thế được một phần nhỏ','Khoảng một nửa','Phần lớn','Gần như không ảnh hưởng'].map((x,i)=>({label:x,score:i}));
  else if(qid==='q5') opts=[{label:'Con cái',key:'child'},{label:'Bố mẹ/người thân',key:'parents'},{label:'Cả hai',key:'both'},{label:'Hiện tại chủ yếu là bản thân tôi',key:'self'}];
  else if(qid==='q6') opts=[{label:'Dưới 3 tháng',score:0},{label:'3–6 tháng',score:1},{label:'6–12 tháng',score:2},{label:'Trên 12 tháng',score:3},{label:'Phần này đã có nguồn tương đối riêng',score:4}];
  else if(qid==='q7') opts=[{label:'Khoản dành cho con/gia đình',key:'family'},{label:'Đầu tư dài hạn',key:'investment'},{label:'Nhà đất/tài sản lớn',key:'property'},{label:'Nguồn vốn tạo thu nhập',key:'business_capital'},{label:'Khoản dành cho cuộc sống tương lai',key:'future'},{label:'Tôi chưa phân chia thật rõ',key:'unclear'}];
  else if(qid==='q8') opts=[{label:'Một nguồn riêng đã chuẩn bị',key:'dedicated',score:4},{label:'Tiền đang để dành',key:'savings',score:3},{label:'Một khoản đầu tư',key:'investment',score:2},{label:'Nguồn vốn cho công việc',key:'business_capital',score:1},{label:'Huy động thêm từ nguồn khác',key:'external',score:0}];
  else if(qid==='q9'){
    const k=state.answers.q8?.key;
    if(k==='dedicated') opts=[{label:'Dưới 3 tháng',score:1},{label:'3–6 tháng',score:2},{label:'6–12 tháng',score:3},{label:'Trên 12 tháng',score:4},{label:'Tôi chưa từng tính',score:2,flag:'unknown_buffer'}];
    else opts=[0,1,2,3,4].map(i=>({score:i}));
  }
  else if(qid==='q10') opts=[{score:0},{score:1},{score:3},{score:4},{score:1,flag:'unknown_resilience'}];
  else if(qid==='q11') opts=[0,1,2,3,4].map(i=>({score:i}));
  else if(qid==='q12') opts=[{key:'child'},{key:'lifestyle'},{key:'asset'},{key:'income_capital'},{key:'parents'},{key:'autonomy'}];

  const picked=opts[idx]||{};
  state.answers[qid]={...picked,index:idx};
  if(picked.flag) state.flags[picked.flag]=true;
  if(qid==='q7' && picked.key==='unclear') state.flags.resource_roles_unclear=true;
  document.querySelectorAll('.option').forEach(b=>b.classList.remove('selected')); el.classList.add('selected');
  const reaction=document.getElementById('reaction');
  if(reaction){
    let txt='';
    if(qid==='q1') txt=Q1[idx].reaction;
    if(qid==='q3') txt=['Vậy khả năng làm việc đang là một tài sản tạo thu nhập khá quan trọng.','Dòng tiền hiện đang gắn khá chặt với hoạt động kinh doanh.','Bạn đã có một phần nguồn lực được tạo ra từ tài sản.','Nhiều nguồn tạo tiền thường giúp mình linh hoạt hơn khá nhiều.'][idx];
    if(qid==='q7') txt='Mình sẽ ghi nhớ điều này.';
    if(qid==='q12') txt=`Hiểu rồi. Có lẽ đây chính là điều đáng được đặt ở trung tâm bức tranh của ${who()}.`;
    if(txt){reaction.textContent=txt;reaction.style.display='block';}
  }
  setTimeout(()=>next(qid), qid==='q1'||qid==='q3'||qid==='q7'||qid==='q12'?650:300);
}
function next(qid){
 const map={q1:q2,q2:q3,q3:q4,q4:q5,q5:q6,q6:transition1,q7:q8,q8:q9,q9:q10,q10:q11,q11:q12,q12:analyzing};
 map[qid]();
}
function analyzing(){
 render(`<section class="card transition"><div class="emoji">🧠</div><h2>Đang ghép các lựa chọn của ${who()} thành một bức tranh…</h2><p>Có một vài điểm khá thú vị đang hiện ra. 👀</p><div class="progress" style="margin-top:18px;height:10px"><div id="ana" style="width:10%"></div></div></section>`,12);
 let w=10; const t=setInterval(()=>{w+=18; const a=document.getElementById('ana'); if(a)a.style.width=Math.min(w,100)+'%'; if(w>=100){clearInterval(t);setTimeout(results,250)}},140);
}
function scoreOf(q){return Number(state.answers[q]?.score ?? 0)}
function clamp(v,min=0,max=4){return Math.max(min,Math.min(max,v))}
function calcConflict(){
 const keep=state.answers.q7?.key, source=state.answers.q8?.key, q9=scoreOf('q9');
 if(keep==='unclear'){ state.flags.resource_roles_unclear=true; return 2; }
 if(source==='dedicated') return 4;
 if(keep==='investment' && source==='investment') return q9<=1?0:q9===2?1:2;
 if(keep==='business_capital' && source==='business_capital') return q9<=1?0:q9===2?1:2;
 if(keep==='family' && source==='savings') return q9<=1?1:q9===2?2:3;
 if(keep==='future' && source==='savings') return q9<=1?1:q9===2?2:3;
 if(keep==='property' && source==='external') return 3;
 return q9>=3?4:q9===2?3:2;
}
function level(v){ if(v<3)return'Cần làm rõ'; if(v<5)return'Nên củng cố'; if(v<7)return'Khá'; if(v<8.5)return'Vững'; return'Rất vững'; }
function metricCard(name,val,desc){return `<div class="metric"><div class="metricTop"><span>${name}</span><span>${val.toFixed(1)}/10</span></div><div class="bar"><div style="width:${val*10}%"></div></div><small>${level(val)}${desc?' • '+desc:''}</small></div>`}
function desiredLabel(v){return ['Thực tế','Cân bằng','Chủ động','Cao','Rất cao'][v]||'—'}
function personaFor(s){
 const {CF,VB,GK,TL,YTgap}=s; const q3=state.answers.q3?.key, q1=state.answers.q1?.key;
 if(CF>=7&&VB>=7&&GK>=7&&TL>=7&&Math.min(CF,VB,GK,TL)>=6.5&&YTgap<=2&&!state.flags.resource_roles_unclear) return {name:'Người có cấu trúc tài chính vững',emoji:'🧱'};
 if((q1==='asset'||q1==='invest')&&(VB<5.5||s.conflict<=1.5)) return {name:'Tài sản là trọng tâm – vùng đệm chưa tương xứng',emoji:'🏗️'};
 if((q3==='salary'||q3==='business')&&scoreOf('q4')<=2&&state.answers.q5?.key!=='self') return {name:'Thu nhập gắn nhiều với chính mình',emoji:'⚙️'};
 if(scoreOf('q8')>=3&&scoreOf('q9')>=3&&(state.flags.unknown_resilience||state.flags.unknown_buffer)) return {name:'Có vùng đệm – chưa biết “đủ” là bao nhiêu',emoji:'🛟'};
 const vals=[CF,VB,GK,TL], spread=Math.max(...vals)-Math.min(...vals);
 if(vals.every(v=>v>=5.5&&v<=8.5)&&spread<=2.5) return {name:'Người giữ cân bằng',emoji:'⚖️'};
 return {name:'Người đang kiến tạo',emoji:'🌱'};
}
function labelGoal(){const k=state.answers.q1?.key; return {child:'tương lai của con',asset:'việc xây dựng thêm tài sản',business:'sự phát triển của công việc/kinh doanh',invest:'việc tích lũy và đầu tư',future:'một tương lai chủ động và thảnh thơi hơn'}[k]||'mục tiêu quan trọng';}
function labelKeep(){const k=state.answers.q7?.key;return {family:'khoản dành cho con/gia đình',investment:'khoản đầu tư dài hạn',property:'nhà đất/tài sản lớn',business_capital:'nguồn vốn tạo thu nhập',future:'khoản dành cho cuộc sống tương lai',unclear:'các nguồn lực hiện chưa được phân vai thật rõ'}[k]||'nguồn lực quan trọng';}
function labelSource(){const k=state.answers.q8?.key;return {dedicated:'một nguồn riêng đã chuẩn bị',savings:'tiền đang để dành',investment:'một khoản đầu tư',business_capital:'nguồn vốn cho công việc',external:'nguồn huy động bên ngoài'}[k]||'một nguồn hiện có';}
function labelLock(){const k=state.answers.q12?.key;return {child:'tương lai của con',lifestyle:'mức sống của gia đình',asset:'tài sản đang gây dựng',income_capital:'nguồn vốn tạo thu nhập',parents:'cuộc sống của bố mẹ/người thân',autonomy:'sự chủ động và quyền lựa chọn của chính mình'}[k]||'điều quan trọng nhất';}
function resultNarrative(s,persona){
 const vals={CF:s.CF,VB:s.VB,GK:s.GK,TL:s.TL}; const names={CF:'sức bền dòng tiền',VB:'vùng đệm độc lập',GK:'khả năng giữ tài sản & kế hoạch',TL:'khả năng duy trì tương lai'};
 const strong=Object.entries(vals).sort((a,b)=>b[1]-a[1])[0][0]; const weak=Object.entries(vals).sort((a,b)=>a[1]-b[1])[0][0];
 let conflictText='';
 if(s.conflict<=1.5) conflictText=`Điểm đáng chú ý là nguồn ${lowerPronoun()} nghĩ tới khi cần một khoản lớn lại có khả năng chạm vào <b>${labelKeep()}</b> — đúng phần mình muốn giữ nguyên.`;
 else if(state.flags.resource_roles_unclear) conflictText=`Một điểm cần làm rõ thêm là hiện các nguồn lực vẫn <b>chưa được phân vai thật rõ</b>. Có nguồn lực và có cấu trúc là hai chuyện khác nhau.`;
 else conflictText=`Cách ${lowerPronoun()} dự kiến huy động nguồn lực hiện chưa tạo ra xung đột lớn với phần muốn giữ.`;
 let yt='';
 if(s.YTgap>2) yt=`Mức chủ động y tế ${lowerPronoun()} mong muốn đang cao hơn mức sẵn sàng hiện tại, nên đây cũng là một khoảng đáng để làm rõ thêm.`;
 else yt=`Mức sẵn sàng hiện tại đang khá gần với tiêu chuẩn chủ động y tế mà ${lowerPronoun()} mong muốn.`;
 return `<p>${who()} đang dành nhiều ưu tiên cho <b>${labelGoal()}</b>. Trong bức tranh hiện tại, <b>${names[strong]}</b> là một trong những điểm tốt hơn, còn <b>${names[weak]}</b> là phần có dư địa củng cố rõ nhất.</p><p>${conflictText}</p><p>${yt}</p><p>Và vì ${lowerPronoun()} chọn <b>${labelLock()}</b> là điều không muốn bị thay đổi, phần đáng củng cố trước không nhất thiết là “có thêm thật nhiều tiền”, mà là <b>tạo khoảng cách rõ hơn giữa tiền dành cho tương lai và nguồn lực dành cho những việc không nằm trong kế hoạch.</b></p>`;
}
function results(){
 const q2=scoreOf('q2'),q4=scoreOf('q4'),q6=scoreOf('q6'),q8=scoreOf('q8'),q9=scoreOf('q9'),q10=scoreOf('q10'),q11=scoreOf('q11');
 const conflict=calcConflict();
 const CF=(.6*q4+.4*q10)*2.5;
 const VB=(.25*q2+.35*q8+.4*q9)*2.5;
 const GK=(.2*q2+.35*q9+.45*conflict)*2.5;
 const TL=(.3*q2+.4*q6+.3*q10)*2.5;
 const ytReady=(.4*q8+.45*q9+.15*q10); const YTgap=Math.max(0,q11-ytReady);
 const s={CF,VB,GK,TL,ytReady:ytReady*2.5,ytDesired:q11*2.5,YTgap:YTgap*2.5,conflict};
 const persona=personaFor(s);
 render(`<section class="card">
   <div class="resultHead"><div class="badge">${persona.emoji}</div><div><div class="persona">Chân dung của ${who()}</div><h2>${persona.name}</h2></div></div>
   <p class="muted">Không phải một “điểm phán xét”, mà là bức tranh về cách các nguồn lực hiện đang phối hợp với nhau.</p>
   <div class="metrics">
    ${metricCard('Sức bền dòng tiền',CF,'Tài sản tạo thu nhập có nguồn thay thế đến đâu')}
    ${metricCard('Vùng đệm độc lập',VB,'Nguồn lớn có tách khỏi mục tiêu khác không')}
    ${metricCard('Giữ tài sản & kế hoạch',GK,'Khả năng tránh phải đổi nhiệm vụ tài sản')}
    ${metricCard('Duy trì tương lai',TL,'Khả năng giữ những trách nhiệm quan trọng')}
   </div>
   <h3>Quyền chủ động y tế</h3>
   <div class="ytbox"><div class="ytitem">Mức mong muốn<strong>${s.ytDesired.toFixed(1)}/10</strong><span class="tiny">${desiredLabel(q11)}</span></div><div class="ytitem">Mức sẵn sàng hiện tại<strong>${s.ytReady.toFixed(1)}/10</strong><span class="tiny">Dựa trên nguồn lực đã chọn</span></div></div>
   <div class="gap">${s.YTgap>2?'Có một khoảng cách đáng để làm rõ thêm.':'Hai mức đang khá gần nhau.'}</div>
   <div class="insight"><h3>Bức tranh nói gì?</h3>${resultNarrative(s,persona)}</div>
   <div class="note"><b>“Chúng ta thường chú ý giữ những tài sản đã tạo ra, nhưng đôi khi lại quên mất tài sản đang tạo ra tất cả những tài sản đó.”</b></div>
   <div class="feedback"><h3>${who()} thấy bức tranh này giống mình đến mức nào?</h3><div class="feedbackBtns"><button onclick="feedback('Rất đúng',this)">Rất đúng</button><button onclick="feedback('Khá đúng',this)">Khá đúng</button><button onclick="feedback('Chưa đúng lắm',this)">Chưa đúng lắm</button></div><div id="feedbackMore" class="field hidden"><label>Điểm nào chưa đúng nhất?</label><input id="feedbackText" placeholder="Gõ vài chữ..."></div></div>
   <button class="btn primary" onclick="tier2Placeholder()">Tính vùng đệm phù hợp với tôi →</button>
   <button class="btn ghost" onclick="restart()">Làm lại bài kiểm tra</button>
  </section>`,12);
}
function feedback(val,el){state.feedback=val;document.querySelectorAll('.feedbackBtns button').forEach(b=>b.classList.remove('active'));el.classList.add('active');const box=document.getElementById('feedbackMore'); if(val==='Chưa đúng lắm')box.classList.remove('hidden'); else box.classList.add('hidden');}
function tier2Placeholder(){
 render(`<section class="card transition"><div class="emoji">📐</div><h2>Tầng 2 sẽ bắt đầu từ đây</h2><p>${who()} sẽ dùng thêm khoảng 6 câu ngắn để biến bức tranh vừa rồi thành <b>một vùng đệm mục tiêu bằng con số</b>.</p><div class="note">Trong MVP V1.2 hiện tại, Tầng 1 đã hoàn chỉnh. Tầng 2 sẽ được nối vào sau khi kiểm thử phản hồi của người dùng thật.</div><button class="btn primary" onclick="results()">Quay lại kết quả</button><button class="btn ghost" onclick="restart()">Làm lại bài kiểm tra</button></section>`);
}
function restart(){ Object.assign(state,{name:'',pronoun:'Anh',current:0,answers:{},scores:{},flags:{},history:[]}); intro(); }
intro();
</script>
