<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Sức Bền Tài Chính — MVP V1.6</title>
<style>
  :root{
    --bg:#f6f8f7;
    --card:#ffffff;
    --ink:#16312b;
    --muted:#6b7d78;
    --line:#dde7e3;
    --accent:#178f67;
    --accent-2:#e8f6f0;
    --soft:#f0f5f3;
    --warn:#a96d20;
    --shadow:0 12px 30px rgba(26,60,49,.08);
    --radius:24px;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(180deg,#f9fbfa 0%,var(--bg) 100%);color:var(--ink);min-height:100vh}
  .app{max-width:760px;margin:0 auto;min-height:100vh;padding:18px 16px 40px}
  .topbar{display:flex;align-items:center;gap:12px;margin:2px 0 18px}
  .brandmark{width:42px;height:42px;border-radius:14px;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:21px;font-weight:800;box-shadow:var(--shadow)}
  .brandtxt{line-height:1.2;min-width:0}.brandtxt b{display:block;font-size:15px}.brandtxt span{font-size:12px;color:var(--muted)}
  .authorMini{display:none;margin-top:3px;font-size:11px;font-weight:750;color:#0c6d4d;white-space:nowrap}
  .progressWrap{margin-left:auto;min-width:125px}.progressLabel{font-size:11px;color:var(--muted);text-align:right;margin-bottom:6px}.progress{height:7px;background:#e7efec;border-radius:999px;overflow:hidden}.progress>div{height:100%;width:0;background:var(--accent);transition:width .35s ease}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:26px 22px}
  .hero{padding-top:34px;padding-bottom:34px}.heroIcon{font-size:52px;margin-bottom:14px}
  h1,h2,h3{margin:0 0 12px;letter-spacing:-.02em}h1{font-size:31px;line-height:1.12}h2{font-size:25px;line-height:1.2}h3{font-size:19px}
  p{font-size:16px;line-height:1.6;margin:8px 0;color:#29443c}.muted{color:var(--muted)}
  .note{background:var(--soft);border-radius:18px;padding:14px 16px;margin-top:16px;font-size:14px;line-height:1.5;color:#49625a}
  .btn{width:100%;border:none;border-radius:17px;padding:16px 18px;font-size:16px;font-weight:750;cursor:pointer;transition:.18s ease;margin-top:16px}
  .btn.primary{background:var(--accent);color:white;box-shadow:0 9px 18px rgba(23,143,103,.18)}
  .btn.primary:hover{transform:translateY(-1px)}
  .btn.secondary{background:var(--accent-2);color:#0c6d4d}
  .btn.ghost{background:white;border:1px solid var(--line);color:var(--ink)}
  .grid{display:grid;gap:10px;margin-top:18px}.option{border:1px solid var(--line);background:#fff;border-radius:17px;padding:15px 16px;text-align:left;font-size:15px;line-height:1.45;cursor:pointer;transition:.16s ease;color:var(--ink)}
  .option:hover{border-color:#9ecfbd;background:#fbfefd;transform:translateY(-1px)}
  .option.selected{border-color:var(--accent);background:var(--accent-2)}
  .kicker{font-size:13px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
  .fun{font-size:14px;color:var(--muted);font-style:italic;margin-top:12px}
  .reaction{margin-top:16px;background:var(--accent-2);padding:13px 15px;border-radius:16px;font-size:14px;color:#0e6348;display:none}
  .field{margin-top:16px}.field label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}.field input,.field select{width:100%;padding:15px;border:1px solid var(--line);border-radius:15px;font-size:16px;outline:none;background:#fff}.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(23,143,103,.08)}
  .moneyWrap{display:flex;align-items:center;gap:8px}.moneyWrap input{flex:1}.unit{font-size:13px;color:var(--muted);white-space:nowrap}.summaryGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.summaryBox{background:var(--soft);border-radius:17px;padding:14px}.summaryBox span{display:block;font-size:12px;color:var(--muted)}.summaryBox strong{display:block;font-size:22px;margin-top:5px}.zone{border:1px solid var(--line);border-radius:17px;padding:15px;margin-top:10px}.zone b{display:block;margin-bottom:5px}.layer{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:17px;padding:14px;margin-top:10px}.layerNum{width:32px;height:32px;border-radius:10px;background:var(--accent-2);display:grid;place-items:center;font-weight:850;color:#0c6d4d;flex:0 0 auto}.strategy{border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:10px;cursor:pointer}.strategy.selected{background:var(--accent-2);border-color:var(--accent)}
  .rangeCard{background:var(--soft);border-radius:20px;padding:18px;margin-top:16px}.rangeTop{display:flex;justify-content:space-between;align-items:end;gap:12px}.rangeTop span{font-size:13px;color:var(--muted)}.rangeTop strong{font-size:30px;color:var(--accent)}.rangeCard input[type=range]{width:100%;margin:18px 0 10px;accent-color:var(--accent)}.splitPreview{display:grid;grid-template-columns:1fr 1fr;gap:10px}.splitPreview>div{background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px}.splitPreview span{display:block;font-size:12px;color:var(--muted)}.splitPreview b{display:block;font-size:18px;margin-top:4px}.compareMoney{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.compareMoney div{background:var(--soft);border-radius:13px;padding:10px}.compareMoney span{display:block;font-size:11px;color:var(--muted)}.compareMoney strong{display:block;font-size:16px;margin-top:4px}.strategy.selected .compareMoney div{background:#fff}.wowNumber{font-size:34px;font-weight:900;color:var(--accent);letter-spacing:-.03em;margin:8px 0}.questionHero{font-size:24px;line-height:1.3;font-weight:850;margin:14px 0;color:var(--ink)}
  .seg{display:flex;gap:8px}.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px;font-weight:700;cursor:pointer}.seg button.active{background:var(--accent-2);border-color:var(--accent);color:#0c6d4d}
  .transition{padding:36px 22px;text-align:center}.transition .emoji{font-size:48px;margin-bottom:12px}
  .resultHead{display:flex;gap:14px;align-items:center;margin-bottom:18px}.badge{width:58px;height:58px;border-radius:18px;background:var(--accent-2);display:grid;place-items:center;font-size:30px}.persona{font-size:13px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}
  .metrics{display:grid;gap:13px;margin:18px 0}.metric{border:1px solid var(--line);border-radius:17px;padding:14px 15px}.metricTop{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:750}.metricTop span:last-child{color:var(--accent)}.bar{height:8px;background:#e7efec;border-radius:999px;overflow:hidden;margin-top:9px}.bar>div{height:100%;background:var(--accent);border-radius:999px}.metric small{display:block;margin-top:7px;color:var(--muted);font-size:12px}
  .insight{background:#f9fbfa;border-left:4px solid var(--accent);border-radius:0 17px 17px 0;padding:16px 17px;margin-top:18px}.insight b{color:#0a694b}
  .ytbox{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ytitem{background:var(--soft);border-radius:16px;padding:14px}.ytitem strong{display:block;font-size:20px;margin-top:6px}.gap{margin-top:10px;font-size:14px;color:#4c615b}
  .feedback{margin-top:22px;padding-top:20px;border-top:1px solid var(--line)}.feedbackBtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.feedbackBtns button{padding:11px;border-radius:13px;border:1px solid var(--line);background:white;cursor:pointer;font-weight:700}.feedbackBtns button.active{background:var(--accent-2);border-color:var(--accent)}
  .tiny{font-size:12px;color:var(--muted)}
  .footer{padding:18px 4px 0;text-align:center;color:var(--muted);font-size:11px;line-height:1.6}.copyright{margin-top:4px;color:#456057;font-weight:650}
  .hidden{display:none!important}
  @media(max-width:520px){.app{padding:12px 10px 30px}.card{padding:22px 17px;border-radius:21px}h1{font-size:28px}h2{font-size:23px}.progressWrap{min-width:88px}.feedbackBtns{grid-template-columns:1fr}.ytbox,.summaryGrid{grid-template-columns:1fr}.authorMini{font-size:10px}.brandtxt span{font-size:10px}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brandmark">S</div>
    <div class="brandtxt"><b>Sức Bền Tài Chính</b><span id="versionLabel">MVP V1.6 • Tầng 1</span><div class="authorMini" id="authorMini">Nguyễn Thành • 0986831158</div></div>
    <div class="progressWrap" id="progressWrap" style="display:none">
      <div class="progressLabel" id="progressLabel">Khám phá bản thân</div>
      <div class="progress"><div id="progressBar"></div></div>
    </div>
  </div>
  <main id="screen"></main>
  <div class="footer">Bản prototype thử nghiệm — không có đáp án đúng hay sai.<div class="copyright" id="footerCopyright">© 2026 Bản quyền tác giả: Nguyễn Thành • 0986831158 • Manulife Việt Nam</div></div>
</div>
<script>
const state = {
  name:'', pronoun:'Anh', current:0,
  answers:{}, scores:{}, flags:{},
  history:[], multi:{}
};

const screen = document.getElementById('screen');
const progressWrap = document.getElementById('progressWrap');
const progressBar = document.getElementById('progressBar');
const progressLabel = document.getElementById('progressLabel');
const authorMini = document.getElementById('authorMini');
const footerCopyright = document.getElementById('footerCopyright');
const versionLabel = document.getElementById('versionLabel');
function headerMode(isIntro=false,tier=1){
  authorMini.style.display=isIntro?'none':'block';
  footerCopyright.style.display=isIntro?'block':'none';
  versionLabel.textContent=`MVP V1.6 • Tầng ${tier}`;
}
function renderTier(html,label,pct,tier){
  screen.innerHTML=html; headerMode(false,tier); progressWrap.style.display='block';
  progressLabel.textContent=label; progressBar.style.width=Math.max(0,Math.min(100,pct))+'%';
  window.scrollTo({top:0,behavior:'smooth'});
}
function fmtM(v){ v=Number(v||0); return v>=1000 ? (v/1000).toLocaleString('vi-VN',{maximumFractionDigits:2})+' tỷ' : v.toLocaleString('vi-VN',{maximumFractionDigits:1})+' triệu'; }
function numVal(id){ const el=document.getElementById(id); return Math.max(0,Number((el?.value||'0').replace(',','.'))||0); }

function who(){ return `${state.pronoun} ${state.name}`.trim(); }
function capPronoun(){ return state.pronoun || 'Bạn'; }
function lowerPronoun(){ return state.pronoun==='Bạn' ? 'bạn' : state.pronoun.toLowerCase(); }
function setProgress(step){
  progressWrap.style.display = step? 'block':'none';
  if(!step) return;
  const pct = Math.min(100, Math.round((step/12)*100));
  progressBar.style.width = pct+'%';
  const labels = step<=3?'Khám phá bản thân':step<=6?'Hiểu nguồn lực':step<=9?'Kiểm tra nguồn dự phòng':'Ghép bức tranh';
  progressLabel.textContent = labels;
}
function render(html, step=0){ screen.innerHTML=html; setProgress(step); window.scrollTo({top:0,behavior:'smooth'}); }
function primary(label, action){ return `<button class="btn primary" onclick="${action}">${label}</button>`; }
function optionList(options, qid, reactionFn){
  return `<div class="grid">${options.map((o,i)=>`<button class="option" onclick="answer('${qid}', ${i}, this)"><b>${String.fromCharCode(65+i)}.</b> ${o.label}</button>`).join('')}</div><div id="reaction" class="reaction"></div>`;
}

function multiOptionList(options,qid,max=2,exclusiveKeys=[]){
  return `<div class="grid">${options.map((o,i)=>`<button class="option" data-idx="${i}" onclick="toggleMulti('${qid}',${i},this,${max},${JSON.stringify(exclusiveKeys).replace(/"/g,'&quot;')})"><b>${String.fromCharCode(65+i)}.</b> ${o.label}</button>`).join('')}</div><div class="tiny" style="margin-top:10px">Có thể chọn tối đa ${max} phương án phù hợp nhất.</div><div id="reaction" class="reaction"></div><button id="multiNext" class="btn primary" style="display:none" onclick="commitMulti('${qid}')">Tiếp tục →</button>`;
}
function getOptions(qid){
  if(qid==='q1') return Q1;
  if(qid==='q5') return [{label:'Con cái',key:'child'},{label:'Bố mẹ/người thân',key:'parents'},{label:'Hiện tại chủ yếu là bản thân tôi',key:'self'}];
  if(qid==='q7') return [{label:'Khoản dành cho con/gia đình',key:'family'},{label:'Đầu tư dài hạn',key:'investment'},{label:'Nhà đất/tài sản lớn',key:'property'},{label:'Nguồn vốn tạo thu nhập',key:'business_capital'},{label:'Khoản dành cho cuộc sống tương lai',key:'future'},{label:'Tôi chưa phân chia thật rõ',key:'unclear'}];
  return [];
}
function toggleMulti(qid,idx,el,max,exclusiveKeys){
  const opts=getOptions(qid), picked=opts[idx];
  state.multi=state.multi||{}; let arr=state.multi[qid]||[];
  const isExclusive=exclusiveKeys.includes(picked.key);
  const exists=arr.includes(idx);
  if(exists) arr=arr.filter(x=>x!==idx);
  else if(isExclusive){ arr=[idx]; }
  else {
    arr=arr.filter(x=>!exclusiveKeys.includes(opts[x]?.key));
    if(arr.length<max) arr.push(idx); else return;
  }
  state.multi[qid]=arr;
  document.querySelectorAll('.option').forEach((b,i)=>b.classList.toggle('selected',arr.includes(i)));
  const nextBtn=document.getElementById('multiNext'); if(nextBtn) nextBtn.style.display=arr.length?'block':'none';
  const reaction=document.getElementById('reaction');
  if(reaction){
    let txt='';
    if(qid==='q1'&&arr.length) txt=arr.length===1?Q1[arr[0]].reaction:'Hai ưu tiên này sẽ được đặt cạnh nhau trong bức tranh cuối.';
    if(qid==='q7'&&arr.length) txt='Mình sẽ ghi nhớ những phần bạn muốn giữ nguyên nhất.';
    if(qid==='q5'&&arr.length) txt='Hiểu rồi. Đây là những người/nhóm đang nằm trong bức tranh trách nhiệm của bạn.';
    if(txt){reaction.textContent=txt;reaction.style.display='block';} else reaction.style.display='none';
  }
}
function commitMulti(qid){
  const opts=getOptions(qid), arr=(state.multi&&state.multi[qid])||[];
  const picks=arr.map(i=>({...opts[i],index:i}));
  state.answers[qid]={multi:true,picks,keys:picks.map(x=>x.key),key:picks[0]?.key,indexes:arr};
  if(qid==='q7'&&picks.some(x=>x.key==='unclear')) state.flags.resource_roles_unclear=true;
  next(qid);
}
function singleHint(){return `<div class="tiny" style="margin-top:10px">Hãy chọn phương án gần nhất với thực tế hiện tại của bạn.</div>`;}

function intro(){
  headerMode(true,1);
  render(`<section class="card hero">
    <div class="heroIcon">🌱</div>
    <div class="kicker">Một cuộc khám phá nhỏ về chính mình</div>
    <h1>Thật tuyệt khi bạn dành vài phút để hiểu rõ hơn về tài chính của chính mình 👏</h1>
    <p>Không cần biết nhiều về tài chính. Chỉ cần trả lời đúng với cuộc sống hiện tại của bạn.</p>
    <div class="note">Sau vài phút, bạn sẽ nhìn thấy một bức tranh khá thú vị về <b>điều mình đang xây dựng – những gì mình muốn giữ – và mức độ chủ động hiện tại.</b><br><br>Khoảng 4–5 phút • Không có đáp án đúng hay sai.</div>
    ${primary('Khám phá bức tranh của tôi →','profile()')}
  </section>`);
}
function profile(){
  headerMode(false,1);
  render(`<section class="card">
    <div class="kicker">Làm quen một chút</div>
    <h2>Trước khi bắt đầu, mình làm quen nhé 😊</h2>
    <div class="field"><label>Bạn tên là gì?</label><input id="nameInput" placeholder="Ví dụ: Minh" maxlength="30"></div>
    <div class="field"><label>Mình nên xưng hô với bạn thế nào?</label><div class="seg" id="pronouns">
      <button class="active" onclick="choosePronoun('Anh',this)">Anh</button>
      <button onclick="choosePronoun('Chị',this)">Chị</button>
      <button onclick="choosePronoun('Bạn',this)">Bạn</button>
    </div></div>
    <button class="btn primary" onclick="saveProfile()">Tiếp tục →</button>
  </section>`);
}
function choosePronoun(p, el){ state.pronoun=p; document.querySelectorAll('#pronouns button').forEach(b=>b.classList.remove('active')); el.classList.add('active'); }
function saveProfile(){ const v=document.getElementById('nameInput').value.trim(); state.name=v||'Minh'; welcome(); }
function welcome(){
  render(`<section class="card transition"><div class="emoji">👋</div><h2>Rất vui được đồng hành cùng ${who()}!</h2><p>Mỗi người có một cách xây dựng cuộc sống khác nhau, vì vậy ở đây không có câu trả lời “chuẩn”.</p><div class="note">Điều thú vị là sau vài lựa chọn, ${lowerPronoun()} sẽ nhìn thấy <b>những phần đang khá vững và những phần có thể cần được củng cố thêm.</b></div>${primary('Xem thử nào →','q1()')}</section>`);
}

const Q1=[
 {label:'Con cái có một nền tảng tốt hơn',key:'child',reaction:'Có vẻ tương lai của con là một phần rất quan trọng trong bức tranh ❤️'},
 {label:'Có thêm nhà, đất hoặc tài sản',key:'asset',reaction:'Có vẻ bạn thuộc “team xây tài sản” rồi 😄'},
 {label:'Công việc/kinh doanh phát triển hơn',key:'business',reaction:'Công việc đang là một động lực khá lớn.'},
 {label:'Khoản tích lũy và đầu tư lớn hơn',key:'invest',reaction:'Bạn khá coi trọng việc để nguồn lực tiếp tục lớn lên.'},
 {label:'Cuộc sống tương lai thảnh thơi hơn',key:'future',reaction:'Có vẻ điều bạn hướng tới nhiều nhất là sự chủ động về sau.'}
];
function q1(){
 render(`<section class="card"><div class="kicker">Câu 1 • Điều đang xây</div><h2>${who()} này, nếu 3–5 năm tới mọi việc diễn ra khá thuận lợi, những điều nào khiến ${lowerPronoun()} cảm thấy mình đang đi đúng hướng nhất?</h2><div class="fun">Biết là muốn cả 5 😄 Chọn tối đa 2 điều quan trọng nhất nhé.</div>${multiOptionList(Q1,'q1',2,[])}</section>`,1);
}
function q2(){
 const keys=state.answers.q1?.keys||[state.answers.q1?.key];
 const prompts={child:'Kế hoạch dành cho con hiện đã được chuẩn bị đến đâu rồi?',asset:'Mục tiêu tài sản bạn đang hướng tới hiện đã được chuẩn bị đến đâu?',business:'Kế hoạch phát triển công việc hiện đã được chuẩn bị đến đâu?',invest:'Kế hoạch tích lũy và đầu tư hiện đã đi đến đâu?',future:'Kế hoạch cho cuộc sống bạn mong muốn sau này đã được chuẩn bị đến đâu?'};
 const prompt=keys.length>1?'Với hai ưu tiên vừa chọn, mức độ chuẩn bị nguồn lực cho chúng hiện đang ở đâu?':prompts[keys[0]];
 const opts=['Chủ yếu mới đang nghĩ tới','Đã bắt đầu nhưng chưa tách nguồn rõ','Đã có một phần nguồn lực','Có kế hoạch và nguồn lực khá rõ','Có nguồn riêng và đang đi đúng lộ trình'];
 render(`<section class="card"><div class="kicker">Câu 2 • Mức độ chắc của mục tiêu</div><h2>${prompt}</h2>${optionList(opts.map((x,i)=>({label:x,score:i})),'q2')}${singleHint()}</section>`,2);
}
function q3(){
 const opts=[{label:'Công việc/lương chuyên môn',key:'salary'},{label:'Kinh doanh riêng',key:'business'},{label:'Đầu tư và tài sản',key:'asset'},{label:'Nhiều nguồn kết hợp',key:'mixed'}];
 render(`<section class="card"><div class="kicker">Câu 3 • Tài sản tạo thu nhập</div><h2>Hiện tại nguồn lực tài chính của ${who()} chủ yếu được tạo ra từ đâu?</h2>${optionList(opts,'q3')}</section>`,3);
}
function q4(){
 const k=state.answers.q3?.key;

function scoreOf(q){return Number(state.answers[q]?.score ?? 0)}
function clamp(v,min=0,max=4){return Math.max(min,Math.min(max,v))}
function calcConflict(){
 const keeps=state.answers.q7?.keys||[state.answers.q7?.key], source=state.answers.q8?.key, q9=scoreOf('q9');
 if(keeps.includes('unclear')){ state.flags.resource_roles_unclear=true; return 2; }
 if(source==='dedicated') return 4;
 const one=(keep)=>{
  if(keep==='investment' && source==='investment') return q9<=1?0:q9===2?1:2;
  if(keep==='business_capital' && source==='business_capital') return q9<=1?0:q9===2?1:2;
  if(keep==='family' && source==='savings') return q9<=1?1:q9===2?2:3;
  if(keep==='future' && source==='savings') return q9<=1?1:q9===2?2:3;
  if(keep==='property' && source==='external') return 3;
  return q9>=3?4:q9===2?3:2;
 };
 return Math.min(...keeps.filter(Boolean).map(one));
}
function level(v){ if(v<3)return'Cần làm rõ'; if(v<5)return'Nên củng cố'; if(v<7)return'Khá'; if(v<8.5)return'Vững'; return'Rất vững'; }
function metricCard(name,val,desc){return `<div class="metric"><div class="metricTop"><span>${name}</span><span>${val.toFixed(1)}/10</span></div><div class="bar"><div style="width:${val*10}%"></div></div><small>${level(val)}${desc?' • '+desc:''}</small></div>`}
function desiredLabel(v){return ['Thực tế','Cân bằng','Chủ động','Cao','Rất cao'][v]||'—'}
function personaFor(s){
 const {CF,VB,GK,TL,YTgap}=s; const q3=state.answers.q3?.key, q1keys=state.answers.q1?.keys||[state.answers.q1?.key], q5keys=state.answers.q5?.keys||[state.answers.q5?.key];
 if(CF>=7&&VB>=7&&GK>=7&&TL>=7&&Math.min(CF,VB,GK,TL)>=6.5&&YTgap<=2&&!state.flags.resource_roles_unclear) return {name:'Người có cấu trúc tài chính vững',emoji:'🧱'};
 if((q1keys.includes('asset')||q1keys.includes('invest'))&&(VB<5.5||s.conflict<=1.5)) return {name:'Tài sản là trọng tâm – nguồn dự phòng chưa tương xứng',emoji:'🏗️'};
 if((q3==='salary'||q3==='business')&&scoreOf('q4')<=2&&!q5keys.includes('self')) return {name:'Thu nhập gắn nhiều với chính mình',emoji:'⚙️'};
 if(scoreOf('q8')>=3&&scoreOf('q9')>=3&&(state.flags.unknown_resilience||state.flags.unknown_buffer)) return {name:'Có nguồn dự phòng – chưa biết “đủ” là bao nhiêu',emoji:'🛟'};
 const vals=[CF,VB,GK,TL], spread=Math.max(...vals)-Math.min(...vals);
 if(vals.every(v=>v>=5.5&&v<=8.5)&&spread<=2.5) return {name:'Người giữ cân bằng',emoji:'⚖️'};
 return {name:'Người đang kiến tạo',emoji:'🌱'};
}

function labelLock(){const k=state.answers.q12?.key;return {child:'tương lai của con',lifestyle:'mức sống của gia đình',asset:'tài sản đang gây dựng',income_capital:'nguồn vốn tạo thu nhập',parents:'cuộc sống của bố mẹ/người thân',autonomy:'sự chủ động và quyền lựa chọn của chính mình'}[k]||'điều quan trọng nhất';}
function resultNarrative(s,persona){
 const vals={CF:s.CF,VB:s.VB,GK:s.GK,TL:s.TL}; const names={CF:'sức bền dòng tiền',VB:'nguồn dự phòng độc lập',GK:'khả năng giữ tài sản & kế hoạch',TL:'khả năng duy trì tương lai'};
 const strong=Object.entries(vals).sort((a,b)=>b[1]-a[1])[0][0]; const weak=Object.entries(vals).sort((a,b)=>a[1]-b[1])[0][0];
 let conflictText='';
 if(s.conflict<=1.5) conflictText=`Điểm đáng chú ý là nguồn ${lowerPronoun()} nghĩ tới khi cần một khoản lớn lại có khả năng chạm vào <b>${labelKeep()}</b> — đúng phần mình muốn giữ nguyên.`;
 else if(state.flags.resource_roles_unclear) conflictText=`Một điểm cần làm rõ thêm là hiện các nguồn lực vẫn <b>chưa được phân vai thật rõ</b>. Có nguồn lực và có cấu trúc là hai chuyện khác nhau.`;
 else conflictText=`Cách ${lowerPronoun()} dự kiến huy động nguồn lực hiện chưa tạo ra xung đột lớn với phần muốn giữ.`;
 let yt='';
 if(s.YTgap>2) yt=`Mức chủ động y tế ${lowerPronoun()} mong muốn đang cao hơn mức sẵn sàng hiện tại, nên đây cũng là một khoảng đáng để làm rõ thêm.`;
 else yt=`Mức sẵn sàng hiện tại đang khá gần với tiêu chuẩn chủ động y tế mà ${lowerPronoun()} mong muốn.`;
 return `<p>${who()} đang dành nhiều ưu tiên cho <b>${labelGoal()}</b>. Trong bức tranh hiện tại, <b>${names[strong]}</b> là một trong những điểm tốt hơn, còn <b>${names[weak]}</b> là phần có dư địa củng cố rõ nhất.</p><p>${conflictText}</p><p>${yt}</p><p>Và vì ${lowerPronoun()} chọn <b>${labelLock()}</b> là điều không muốn bị thay đổi, phần đáng củng cố trước không nhất thiết là “có thêm thật nhiều tiền”, mà là <b>tạo khoảng cách rõ hơn giữa tiền dành cho tương lai và nguồn lực dành cho những việc không nằm trong kế hoạch.</b></p>`;
}
function results(){
 const q2=scoreOf('q2'),q4=scoreOf('q4'),q6=scoreOf('q6'),q8=scoreOf('q8'),q9=scoreOf('q9'),q10=scoreOf('q10'),q11=scoreOf('q11');
 const conflict=calcConflict();
 const CF=(.6*q4+.4*q10)*2.5;
 const VB=(.25*q2+.35*q8+.4*q9)*2.5;
 const GK=(.2*q2+.35*q9+.45*conflict)*2.5;
 const TL=(.3*q2+.4*q6+.3*q10)*2.5;
 const ytReady=(.4*q8+.45*q9+.15*q10); const YTgap=Math.max(0,q11-ytReady);
 const s={CF,VB,GK,TL,ytReady:ytReady*2.5,ytDesired:q11*2.5,YTgap:YTgap*2.5,conflict};
 const persona=personaFor(s);
 render(`<section class="card">
   <div class="resultHead"><div class="badge">${persona.emoji}</div><div><div class="persona">Chân dung của ${who()}</div><h2>${persona.name}</h2></div></div>
   <p class="muted">Không phải một “điểm phán xét”, mà là bức tranh về cách các nguồn lực hiện đang phối hợp với nhau.</p>
   <div class="metrics">
    ${metricCard('Sức bền dòng tiền',CF,'Tài sản tạo thu nhập có nguồn thay thế đến đâu')}
    ${metricCard('Nguồn dự phòng độc lập',VB,'Nguồn lớn có tách khỏi mục tiêu khác không')}
    ${metricCard('Giữ tài sản & kế hoạch',GK,'Khả năng tránh phải đổi nhiệm vụ tài sản')}
    ${metricCard('Duy trì tương lai',TL,'Khả năng giữ những trách nhiệm quan trọng')}
   </div>
   <h3>Quyền chủ động y tế</h3>
   <div class="ytbox"><div class="ytitem">Mức mong muốn<strong>${s.ytDesired.toFixed(1)}/10</strong><span class="tiny">${desiredLabel(q11)}</span></div><div class="ytitem">Mức sẵn sàng hiện tại<strong>${s.ytReady.toFixed(1)}/10</strong><span class="tiny">Dựa trên nguồn lực đã chọn</span></div></div>
   <div class="gap">${s.YTgap>2?'Có một khoảng cách đáng để làm rõ thêm.':'Hai mức đang khá gần nhau.'}</div>
   <div class="insight"><h3>Bức tranh nói gì?</h3>${resultNarrative(s,persona)}</div>

   <div class="feedback"><h3>${who()} thấy bức tranh này giống mình đến mức nào?</h3><div class="feedbackBtns"><button onclick="feedback('Rất đúng',this)">Rất đúng</button><button onclick="feedback('Khá đúng',this)">Khá đúng</button><button onclick="feedback('Chưa đúng lắm',this)">Chưa đúng lắm</button></div><div id="feedbackMore" class="field hidden"><label>Điểm nào chưa đúng nhất?</label><input id="feedbackText" placeholder="Gõ vài chữ..."></div></div>
   <button class="btn primary" onclick="tier2Intro()">Tính mức dự phòng phù hợp với tôi →</button>
   <button class="btn ghost" onclick="restart()">Làm lại bài kiểm tra</button>
  </section>`,12);
}

function calcT2(){
 const t=state.t2||{}, months=t.months||12;
 const monthlyGap=Math.max(0,(t.expense||0)-(t.remaining||0));

}

function t3q4(){const opts=[{label:'Tự dùng tài sản của mình để xử lý toàn bộ',key:'self'},{label:'Phối hợp nhiều nguồn để không một khoản nào chịu hết',key:'mix'},{label:'Muốn có một nguồn riêng, để tài sản chính tiếp tục làm nhiệm vụ của nó',key:'dedicated'}];renderTier(`<section class="card"><div class="kicker">Tầng 3 • 4/5</div><h2>Nếu một việc bất ngờ cần khoảng 1 tỷ, ${who()} muốn xử lý theo cách nào hơn?</h2><div class="grid">${opts.map((o,i)=>`<button class="option" onclick="state.t3.oneB='${o.key}';t3q5()"><b>${String.fromCharCode(65+i)}.</b> ${o.label}</button>`).join('')}</div></section>`,`Tầng 3 • Ngưỡng tự giữ`,72,3);}

function t3Result(){let low=state.t3.comfortable||100, high=state.t3.pain||500;if(high<low)high=low;state.t3.low=low;state.t3.high=high;renderTier(`<section class="card"><div class="resultHead"><div class="badge">🎚️</div><div><div class="persona">Tầng 3 • Bản đồ ngưỡng</div><h2>Ba vùng xử lý của ${who()}</h2></div></div><div class="zone"><b>1. TỰ GIỮ</b><span>Khoảng tới <strong>${fmtM(low)}</strong> — mức ${lowerPronoun()} có thể tự xử lý khá thoải mái.</span></div><div class="zone"><b>2. PHỐI HỢP NHIỀU NGUỒN</b><span>Từ khoảng <strong>${fmtM(low)}</strong> đến <strong>${fmtM(high)}</strong> — bắt đầu đáng cân nhắc để không một tài sản phải chịu toàn bộ.</span></div><div class="zone"><b>3. CẦN MỘT CƠ CHẾ RIÊNG</b><span>Trên khoảng <strong>${fmtM(high)}</strong>, đặc biệt với những tình huống ${lowerPronoun()} không muốn tự gánh toàn bộ.</span></div><div class="note"><b>Không để một việc bất ngờ được quyền chọn tài sản nào của mình phải hy sinh.</b></div><button class="btn primary" onclick="tier4Intro()">Sắp xếp bản đồ nguồn lực của tôi →</button></section>`,`Tầng 3 • Kết quả`,100,3);}

// ===== TẦNG 4: BẢN ĐỒ NGUỒN LỰC =====
function tier4Intro(){state.t4=state.t4||{};renderTier(`<section class="card transition"><div class="emoji">🗺️</div><div class="kicker">Tầng 4 • Bản đồ nguồn lực</div><h2>Tiền nào đang làm nhiệm vụ gì?</h2><p>Có tiền là một chuyện. <b>Biết khoản nào được phép dùng, khoản nào nên giữ nguyên</b> là một chuyện khác.</p><button class="btn primary" onclick="t4q1()">Vẽ bản đồ của tôi →</button></section>`,`Tầng 4 • Bản đồ`,5,4);}
function t4q1(){t4Money('t4_liquid','Tầng 4 • 1/5',`Trong 1–2 ngày, ${who()} có thể dùng ngay khoảng bao nhiêu tiền mà không cần bán nhà đất hay rút khoản đầu tư dài hạn?`,'saveT4(\'liquid\',\'t4_liquid\',t4q2)',20,state.t4?.liquid||'');}
function t4Money(id,title,q,next,pct,val=''){renderTier(`<section class="card"><div class="kicker">${title}</div><h2>${q}</h2><div class="field"><div class="moneyWrap"><input id="${id}" inputmode="decimal" type="number" min="0" step="1" value="${val}" placeholder="Ví dụ: 300"><span class="unit">triệu đồng</span></div></div><button class="btn primary" onclick="${next}">Tiếp tục →</button></section>`,`Tầng 4 • Bản đồ`,pct,4);}
function saveT4(key,id,nextFn){state.t4=state.t4||{};state.t4[key]=numVal(id);nextFn();}
function t4q2(){renderTier(`<section class="card"><div class="kicker">Tầng 4 • 2/5</div><h2>Trong số tiền có thể rút khá nhanh, khoảng bao nhiêu % đã được dành sẵn cho việc khác?</h2><div class="fun">Ví dụ: dành cho con, kế hoạch mua nhà, vốn kinh doanh, đầu tư dài hạn…</div><div class="field"><div class="moneyWrap"><input id="t4_assigned" inputmode="numeric" type="number" min="0" max="100" step="5" value="${state.t4?.assigned??50}"><span class="unit">%</span></div></div><button class="btn primary" onclick="state.t4.assigned=Math.min(100,numVal('t4_assigned'));t4q3()">Tiếp tục →</button></section>`,`Tầng 4 • Bản đồ`,38,4);}
function t4q3(){const opts=[{label:'Tiền để dành',key:'savings'},{label:'Đầu tư có thể chuyển đổi',key:'investment'},{label:'Nguồn vốn kinh doanh',key:'business'},{label:'Nguồn hỗ trợ/huy động khác',key:'external'},{label:'Một nguồn độc lập đã chuẩn bị',key:'dedicated'}];renderTier(`<section class="card"><div class="kicker">Tầng 4 • 3/5</div><h2>Nếu nguồn dùng ngay chưa đủ, nguồn thứ hai ${who()} sẽ nghĩ tới là gì?</h2><div class="grid">${opts.map((o,i)=>`<button class="option" onclick="state.t4.second='${o.key}';t4q4()"><b>${String.fromCharCode(65+i)}.</b> ${o.label}</button>`).join('')}</div></section>`,`Tầng 4 • Bản đồ`,56,4);}
function t4q4(){const opts=[{label:'Khoản dành cho con/gia đình',key:'family'},{label:'Đầu tư dài hạn',key:'investment'},{label:'Nhà đất/tài sản lớn',key:'property'},{label:'Vốn đang tạo thu nhập',key:'business'},{label:'Khoản dành cho tương lai',key:'future'}];renderTier(`<section class="card"><div class="kicker">Tầng 4 • 4/5</div><h2>Khoản nào ${who()} muốn loại khỏi danh sách “tiền để xử lý việc bất ngờ” trước tiên?</h2><div class="grid">${opts.map((o,i)=>`<button class="option" onclick="state.t4.exclude='${o.key}';t4q5()"><b>${String.fromCharCode(65+i)}.</b> ${o.label}</button>`).join('')}</div></section>`,`Tầng 4 • Bản đồ`,74,4);}
function t4q5(){
  const target=state.t2calc?.target||0;
  const pct=state.t4?.selfPct||50;
  const own=target*pct/100, rest=Math.max(0,target-own);
  renderTier(`<section class="card"><div class="kicker">Tầng 4 • 5/5</div><h2>Trong mức dự phòng để giữ kế hoạch, ${who()} muốn tự giữ bằng tiền/tài sản của mình bao nhiêu %?</h2><div class="fun">Kéo thanh đến mức khiến ${lowerPronoun()} cảm thấy: “Phần này tôi tự chuẩn bị thì vẫn thoải mái.”</div><div class="rangeCard"><div class="rangeTop"><span>Tỷ lệ tôi muốn tự giữ</span><strong id="selfPctText">${pct}%</strong></div><input id="selfPctRange" type="range" min="10" max="100" step="5" value="${pct}" oninput="updateSelfSlider(this.value)"><div class="splitPreview"><div><span>Tôi tự giữ</span><b id="selfMoney">${fmtM(own)}</b></div><div><span>Phần không muốn tự gánh hết</span><b id="outsideMoney">${fmtM(rest)}</b></div></div></div><button class="btn primary" onclick="saveSelfSlider()">Tiếp tục →</button></section>`,`Tầng 4 • Bản đồ`,90,4);
}
function updateSelfSlider(v){
  const pct=Number(v)||50, target=state.t2calc?.target||0;
  const own=target*pct/100, rest=Math.max(0,target-own);
  const p=document.getElementById('selfPctText'), a=document.getElementById('selfMoney'), b=document.getElementById('outsideMoney');
  if(p)p.textContent=pct+'%'; if(a)a.textContent=fmtM(own); if(b)b.textContent=fmtM(rest);
}
function saveSelfSlider(){state.t4.selfPct=Number(document.getElementById('selfPctRange')?.value||50);t4Result();}
function t4Result(){const target=state.t2calc?.target||0, liquid=state.t4.liquid||0, assigned=(state.t4.assigned||0)/100, usable=Math.max(0,liquid*(1-assigned)), selfPct=state.t4.selfPct||50, selfTarget=target*selfPct/100, outside=Math.max(0,target-selfTarget);state.t4calc={target,usable,selfTarget,outside,selfPct};const ex={family:'khoản dành cho con/gia đình',investment:'đầu tư dài hạn',property:'nhà đất/tài sản lớn',business:'vốn đang tạo thu nhập',future:'khoản dành cho tương lai'}[state.t4.exclude]||'tài sản ưu tiên';renderTier(`<section class="card"><div class="resultHead"><div class="badge">🗺️</div><div><div class="persona">Tầng 4 • Bản đồ nguồn lực</div><h2>Bốn lớp tài chính của ${who()}</h2></div></div><div class="layer"><div class="layerNum">1</div><div><b>Dùng ngay</b><p>Ước tính khoảng <strong>${fmtM(usable)}</strong> có thể dùng nhanh mà không đổi nhiệm vụ phần đã phân bổ.</p></div></div><div class="layer"><div class="layerNum">2</div><div><b>Phần ${lowerPronoun()} muốn tự giữ</b><p>${lowerPronoun()} chọn tự chuẩn bị khoảng <strong>${fmtM(selfTarget)}</strong> — tương đương <strong>${selfPct}%</strong> mức dự phòng để giữ kế hoạch.</p></div></div><div class="layer"><div class="layerNum">3</div><div><b>Tài sản ưu tiên giữ nguyên</b><p><strong>${ex}</strong> được đặt ra ngoài danh sách nguồn nên dùng trước.</p></div></div><div class="layer"><div class="layerNum">4</div><div><b>Phần không muốn tự gánh hoàn toàn</b><p>Khoảng <strong>${fmtM(outside)}</strong> là phần ${lowerPronoun()} muốn tổ chức theo cách khác thay vì để sẵn toàn bộ bằng tiền/tài sản của mình.</p></div></div><div class="note"><b>Không phải tiền nào mình có cũng nên trở thành tiền dùng khi có chuyện.</b></div><button class="btn primary" onclick="tier5Intro()">So sánh 3 cách tổ chức →</button></section>`,`Tầng 4 • Kết quả`,100,4);}

// ===== TẦNG 5: CHIẾN LƯỢC =====
function tier5Intro(){const t=state.t2calc||{},m=state.t4calc||{};renderTier(`<section class="card transition"><div class="emoji">🧭</div><div class="kicker">Tầng 5 • Chiến lược</div><h2>Cùng một mục tiêu, có thể có nhiều cách chuẩn bị</h2><p>Mức dự phòng để giữ kế hoạch của ${who()} là khoảng <b>${fmtM(t.target||0)}</b>. ${capPronoun()} đã chọn tự giữ <b>${fmtM(m.selfTarget||0)}</b>.</p><div class="note">Bây giờ thử đặt ba cách tổ chức cạnh nhau. <b>Cùng một mục tiêu, nhưng lượng tiền cần nằm sẵn trong tài sản của mình có thể rất khác.</b></div><button class="btn primary" onclick="tier5Strategies()">Đặt 3 phương án cạnh nhau →</button></section>`,`Tầng 5 • Chiến lược`,20,5);}
function tier5Strategies(){const t=state.t2calc||{},m=state.t4calc||{},target=t.target||0,self=m.selfTarget||0,out=m.outside||0;renderTier(`<section class="card"><div class="kicker">Tầng 5 • So sánh bằng chính con số của ${who()}</div><h2>Nếu muốn giữ mục tiêu khoảng ${fmtM(target)}, cách nào gần với quan điểm của ${lowerPronoun()} nhất?</h2><div class="fun">Không có phương án đúng cho tất cả mọi người. Hãy chọn cách khiến ${lowerPronoun()} thấy tài sản và kế hoạch của mình được giữ đúng vai trò nhất.</div><div class="strategy" onclick="chooseStrategy('A',this)"><b>A. TỰ TÍCH LŨY TOÀN BỘ</b><p>Toàn bộ mức dự phòng được để sẵn bằng tiền/tài sản của mình.</p><div class="compareMoney"><div><span>Tiền/tài sản tự giữ</span><strong>${fmtM(target)}</strong></div><div><span>Phần từ cơ chế khác</span><strong>0 đồng</strong></div></div></div><div class="strategy" onclick="chooseStrategy('B',this)"><b>B. PHỐI HỢP NHIỀU NGUỒN</b><p>Tự giữ phần mình thấy thoải mái; phần còn lại sẽ được xoay từ nhiều nguồn khi cần để tránh một tài sản chịu toàn bộ.</p><div class="compareMoney"><div><span>Phần tự giữ</span><strong>${fmtM(self)}</strong></div><div><span>Phần cần phối hợp</span><strong>${fmtM(out)}</strong></div></div></div><div class="strategy" onclick="chooseStrategy('C',this)"><b>C. ỦY THÁC MỘT PHẦN RỦI RO</b><p>Tự giữ phần mình muốn. Với phần còn lại, thay vì khóa sẵn toàn bộ tiền từ hôm nay, dùng một khoản chi phí nhỏ hơn để thiết lập một cơ chế có thể tạo nguồn lực theo thỏa thuận khi sự kiện thuộc phạm vi và đáp ứng điều kiện.</p><div class="compareMoney"><div><span>Phần tự giữ</span><strong>${fmtM(self)}</strong></div><div><span>Phần muốn ủy thác</span><strong>${fmtM(out)}</strong></div></div><div class="tiny" style="margin-top:8px">Khoản chi phí thực tế, phạm vi và mức nguồn lực phụ thuộc vào cơ chế và điều kiện được lựa chọn — bài test này chưa giả định một sản phẩm cụ thể.</div></div><button id="strategyNext" class="btn primary" style="display:none" onclick="tier5AfterChoice()">Tiếp tục →</button></section>`,`Tầng 5 • So sánh`,58,5);}
function chooseStrategy(k,el){state.strategy=k;document.querySelectorAll('.strategy').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');const btn=document.getElementById('strategyNext');if(btn){btn.style.display='block';btn.textContent=k==='C'?'Xem điều thú vị này →':'Xem bản kế hoạch của tôi →';}}
function tier5AfterChoice(){state.strategy==='C'?tier5Curiosity():tier5Result();}
function tier5Curiosity(){const t=state.t2calc||{},m=state.t4calc||{},target=t.target||0,self=m.selfTarget||0,out=m.outside||0;renderTier(`<section class="card"><div class="resultHead"><div class="badge">💡</div><div><div class="persona">Một góc nhìn khác</div><h2>Ồ, đây mới là điều thú vị…</h2></div></div><p>Để giữ kế hoạch ở mức khoảng <b>${fmtM(target)}</b>, ${who()} đã chọn tự giữ khoảng <b>${fmtM(self)}</b>.</p><div class="questionHero">Vậy ${fmtM(out)} còn lại có nhất thiết phải nằm sẵn trong tài khoản hoặc tài sản của ${lowerPronoun()} từ hôm nay không?</div><div class="insight"><h3>Không nhất thiết phải theo cùng một cách.</h3><p>Một cơ chế ủy thác phù hợp có thể cho phép ${lowerPronoun()} dành <b>một khoản chi phí nhỏ hơn nhiều so với ${fmtM(out)}</b> để thiết lập mức nguồn lực hướng tới phần mục tiêu này. Nguồn lực chỉ được kích hoạt theo phạm vi, sự kiện và điều kiện đã thỏa thuận.</p></div><div class="note"><b>Ý tưởng không phải “biến ít tiền thành nhiều tiền”.</b><br>Mà là phân vai: phần nào mình tự giữ, phần nào mình không muốn khóa sẵn bằng tài sản của mình, và phần nào có thể ủy thác cho một cơ chế khác.</div><button class="btn primary" onclick="tier5Result()">Đưa lựa chọn này vào bản kế hoạch →</button><button class="btn ghost" onclick="tier5Strategies()">So sánh lại A / B / C</button></section>`,`Tầng 5 • Góc nhìn mới`,78,5);}
function tier5Result(){const t=state.t2calc||{},m=state.t4calc||{},s=state.strategy||'B';const texts={A:`${who()} thiên về việc <b>tự chuẩn bị toàn bộ mức dự phòng bằng tài sản của mình</b>. Cách này rất rõ ràng, đổi lại ${lowerPronoun()} cần giữ sẵn khoảng <b>${fmtM(t.target||0)}</b> cho mục tiêu này và theo dõi để mức dự phòng tăng cùng mức sống, trách nhiệm và tiêu chuẩn chủ động.`,B:`${who()} thiên về <b>phối hợp nhiều nguồn lực</b>: tự giữ khoảng <b>${fmtM(m.selfTarget||0)}</b>, còn khoảng <b>${fmtM(m.outside||0)}</b> sẽ được tổ chức từ nhiều nguồn khi cần. Điểm cần lưu ý là phải biết trước nguồn nào được phép dùng để không làm đảo lộn tài sản ưu tiên.`,C:`${who()} thiên về <b>ủy thác một phần rủi ro</b>: tự giữ khoảng <b>${fmtM(m.selfTarget||0)}</b>, còn phần mục tiêu khoảng <b>${fmtM(m.outside||0)}</b> không nhất thiết phải được khóa sẵn toàn bộ bằng tài sản của mình. Thay vào đó, ${lowerPronoun()} có thể tìm hiểu một cơ chế sử dụng khoản chi phí nhỏ hơn để thiết lập nguồn lực theo thỏa thuận khi sự kiện thuộc phạm vi và đáp ứng điều kiện.`};renderTier(`<section class="card"><div class="resultHead"><div class="badge">🧭</div><div><div class="persona">Tầng 5 • Kế hoạch của ${who()}</div><h2>Giữ quyền lựa chọn</h2></div></div><div class="summaryGrid"><div class="summaryBox"><span>Mức dự phòng để giữ kế hoạch</span><strong>${fmtM(t.target||0)}</strong></div><div class="summaryBox"><span>Phần muốn tự giữ</span><strong>${fmtM(m.selfTarget||0)}</strong></div><div class="summaryBox"><span>Phần không muốn tự gánh hết</span><strong>${fmtM(m.outside||0)}</strong></div><div class="summaryBox"><span>Cách đã chọn</span><strong>${s}</strong></div></div><div class="insight"><h3>Cách tổ chức phù hợp với lựa chọn hiện tại</h3><p>${texts[s]}</p></div>${s==='C'?`<div class="note"><b>Câu hỏi đáng để tìm hiểu tiếp:</b><br>Với ${fmtM(m.outside||0)} mà ${lowerPronoun()} không muốn khóa sẵn, một cơ chế ủy thác phù hợp sẽ cần phạm vi nào, mức nguồn lực bao nhiêu và chi phí ra sao?</div>`:''}<div class="note"><b>Sự chủ động không nằm ở việc có thật nhiều tiền. Mà ở việc khi cần, mình không phải hy sinh điều này để cứu điều khác.</b></div><button class="btn primary" onclick="window.print()">Lưu / in kết quả của tôi</button><button class="btn ghost" onclick="tier5Strategies()">So sánh lại 3 phương án</button><button class="btn ghost" onclick="results()">Xem lại bức tranh Tầng 1</button><button class="btn ghost" onclick="restart()">Làm lại từ đầu</button></section>`,`Tầng 5 • Hoàn tất`,100,5);}

function restart(){ Object.assign(state,{name:'',pronoun:'Anh',current:0,answers:{},scores:{},flags:{},history:[],multi:{},t2:{},t3:{},t4:{},tierMulti:{},strategy:null}); intro(); }
intro();
</script>
